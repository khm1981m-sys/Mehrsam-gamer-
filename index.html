<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صرافی ارز دیجیتال مهرسام گیمر</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #060913;
            --card-bg: rgba(14, 19, 32, 0.8);
            --border-color: rgba(0, 242, 254, 0.3);
            --primary: #00f2fe;
            --secondary: #4facfe;
            --accent: #ff007f;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --green: #10b981;
            --red: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 20px; background-image: radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.07) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(255, 0, 127, 0.07) 0%, transparent 40%); }

        .container { max-width: 1200px; margin: 0 auto; }

        header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--border-color); padding: 20px 30px; border-radius: 20px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); flex-wrap: wrap; gap: 15px; }
        .logo-area h1 { font-size: 20px; font-weight: 900; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-area span { font-size: 11px; color: var(--text-muted); font-weight: 700; display: block; margin-top: 3px; }

        .status-badge { display: flex; align-items: center; gap: 8px; background: rgba(0, 242, 254, 0.1); border: 1px solid rgba(0, 242, 254, 0.3); padding: 8px 16px; border-radius: 30px; font-size: 12px; font-weight: 700; color: var(--primary); }
        .pulse { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 10px var(--primary); animation: pulse 1.5s infinite; }

        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.8; } }

        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; gap: 15px; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 250px; position: relative; }
        .search-box input { width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); padding: 12px 20px 12px 45px; border-radius: 14px; color: #fff; font-size: 14px; outline: none; transition: 0.3s; }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0,242,254,0.3); }

        .refresh-btn { background: linear-gradient(135deg, var(--primary), var(--secondary)); border: none; color: #000; font-weight: 900; padding: 12px 24px; border-radius: 14px; cursor: pointer; transition: 0.3s; font-size: 13px; box-shadow: 0 0 15px rgba(0,242,254,0.4); }
        .refresh-btn:hover { opacity: 0.9; transform: translateY(-2px); }

        .crypto-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .crypto-card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 20px; padding: 22px; transition: 0.3s; box-shadow: 0 8px 25px rgba(0,0,0,0.4); position: relative; overflow: hidden; }
        .crypto-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 12px 35px rgba(0, 242, 254, 0.2); }
        
        .crypto-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .crypto-name { font-size: 16px; font-weight: 700; color: #fff; }
        .crypto-symbol { font-size: 11px; color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 8px; font-weight: 600; }

        .crypto-prices { display: flex; flex-direction: column; gap: 8px; }
        .price-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .price-label { color: var(--text-muted); }
        .price-value { font-weight: 700; font-size: 14px; color: #fff; }
        .price-toman { color: var(--primary); font-weight: 900; font-size: 15px; }

        .loading, .error { grid-column: 1 / -1; text-align: center; padding: 50px; font-size: 15px; color: var(--text-muted); background: var(--card-bg); border-radius: 20px; border: 1px solid var(--border-color); }
        .error { color: var(--red); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-area">
                <h1>صرافی ارز دیجیتال مهرسام گیمر</h1>
                <span>متصل به داده‌های رسمی صرافی اکسیر ⭐ MEHRSAM GAMER</span>
            </div>
            <div class="status-badge">
                <div class="pulse"></div>
                <span id="status-text">برقراری ارتباط با اکسیر...</span>
            </div>
        </header>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="جستجوی ارز (مثال: btc, usdt, eth)..." onkeyup="filterCoins()">
            </div>
            <button class="refresh-btn" onclick="fetchExirData()">به‌روزرسانی قیمت‌ها</button>
        </div>

        <div id="crypto-grid" class="crypto-grid">
            <div class="loading">در حال دریافت داده‌ها از صرافی اکسیر...</div>
        </div>
    </div>

    <script>
        let allCoinsData = [];
        let usdtTomanPrice = 60000; // مقدار پایه تتر برای تبدیل دلاری

        async function fetchExirData() {
            const grid = document.getElementById('crypto-grid');
            const statusText = document.getElementById('status-text');

            try {
                // اتصال مستقیم به API صرافی اکسیر
                const response = await fetch('https://api.exir.io/v2/tickers');
                if (!response.ok) throw new Error('خطا در دریافت پاسخ از سرور اکسیر');
                
                const data = await response.json();
                allCoinsData = Object.keys(data).map(symbol => {
                    return {
                        symbol: symbol.toUpperCase(),
                        last: parseFloat(data[symbol].last || 0),
                        high: parseFloat(data[symbol].high || 0),
                        low: parseFloat(data[symbol].low || 0),
                        volume: parseFloat(data[symbol].volume || 0)
                    };
                });

                // استخراج نرخ تتر به تومان از صرافی اکسیر
                const usdtPair = allCoinsData.find(c => c.symbol === 'USDT-IRT' || c.symbol === 'USDT-TMN');
                if (usdtPair && usdtPair.last > 0) {
                    usdtTomanPrice = usdtPair.last;
                }

                statusText.innerText = "متصل به اکسیر (" + new Date().toLocaleTimeString('fa-IR') + ")";
                renderCoins(allCoinsData);

            } catch (error) {
                console.error(error);
                statusText.innerText = "خطا در اتصال به اکسیر";
                grid.innerHTML = `<div class="error">خطا در برقراری ارتباط با صرافی اکسیر. لطفاً اینترنت خود را بررسی کنید یا بعداً تلاش نمایید.</div>`;
            }
        }

        function renderCoins(coins) {
            const grid = document.getElementById('crypto-grid');
            grid.innerHTML = '';

            if (coins.length === 0) {
                grid.innerHTML = `<div class="loading">هیچ ارزی با این مشخصات یافت نشد.</div>`;
                return;
            }

            coins.forEach(coin => {
                let priceInToman = 0;
                let basePriceDisplay = coin.last.toLocaleString();

                // اگر جفت ارز بر پایه تومان یا ریال باشد
                if (coin.symbol.includes('-IRT') || coin.symbol.includes('-TMN')) {
                    priceInToman = coin.last;
                } 
                // اگر جفت ارز بر پایه تتر باشد
                else if (coin.symbol.includes('-USDT')) {
                    priceInToman = coin.last * usdtTomanPrice;
                }

                const coinName = coin.symbol.split('-')[0];

                const card = document.createElement('div');
                card.className = 'crypto-card';
                card.innerHTML = `
                    <div class="crypto-header">
                        <span class="crypto-name">${coinName}</span>
                        <span class="crypto-symbol">${coin.symbol}</span>
                    </div>
                    <div class="crypto-prices">
                        <div class="price-row">
                            <span class="price-label">قیمت در اکسیر:</span>
                            <span class="price-value">${basePriceDisplay}</span>
                        </div>
                        <div class="price-row">
                            <span class="price-label">معادل تقریبی تومان:</span>
                            <span class="price-value price-toman">${priceInToman > 0 ? Math.round(priceInToman).toLocaleString() + ' تومان' : 'نامشخص'}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCoins() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allCoinsData.filter(c => c.symbol.toLowerCase().includes(query));
            renderCoins(filtered);
        }

        // دریافت اولیه اطلاعات هنگام لود صفحه
        fetchExirData();

        // به‌روزرسانی خودکار هر ۳۰ ثانیه
        setInterval(fetchExirData, 30000);
    </script>
</body>
</html>
